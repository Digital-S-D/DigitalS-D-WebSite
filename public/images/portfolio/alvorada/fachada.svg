<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0C1B20"/>
              <stop offset="55%" stop-color="#1E3640"/>
              <stop offset="100%" stop-color="#2c4a4f"/>
            </linearGradient>
            <radialGradient id="sun" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#F3E6C9"/>
              <stop offset="45%" stop-color="#BA8938"/>
              <stop offset="100%" stop-color="#BA8938" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="600" height="500" fill="url(#sky)"/>
          <circle cx="300" cy="330" r="190" fill="url(#sun)" opacity="0.9"/>
          <circle cx="300" cy="330" r="58" fill="#F3E6C9"/>
          <!-- linhas de escala, referência de projeto -->
          <g stroke="rgba(251,250,247,0.18)" stroke-width="1">
            <line x1="0" y1="200" x2="600" y2="200"/>
            <line x1="0" y1="260" x2="600" y2="260"/>
          </g>
          <!-- skyline -->
          <g fill="#0C1B20">
            <rect x="40" y="300" width="70" height="180"/>
            <rect x="120" y="250" width="90" height="230"/>
            <rect x="225" y="210" width="110" height="270"/>
            <rect x="350" y="270" width="80" height="210"/>
            <rect x="445" y="235" width="100" height="245"/>
          </g>
          <!-- janelas acesas -->
          <g fill="#F3E6C9" opacity="0.85">
            <rect x="55" y="320" width="8" height="8"/><rect x="80" y="340" width="8" height="8"/><rect x="55" y="360" width="8" height="8"/>
            <rect x="140" y="275" width="8" height="8"/><rect x="165" y="300" width="8" height="8"/><rect x="190" y="275" width="8" height="8"/><rect x="140" y="330" width="8" height="8"/>
            <rect x="245" y="235" width="9" height="9"/><rect x="275" y="260" width="9" height="9"/><rect x="305" y="235" width="9" height="9"/><rect x="245" y="300" width="9" height="9"/><rect x="305" y="300" width="9" height="9"/>
            <rect x="370" y="295" width="8" height="8"/><rect x="395" y="320" width="8" height="8"/>
            <rect x="465" y="260" width="9" height="9"/><rect x="495" y="285" width="9" height="9"/><rect x="465" y="320" width="9" height="9"/>
          </g>
          <line x1="0" y1="480" x2="600" y2="480" stroke="rgba(251,250,247,0.35)" stroke-width="1.5"/>
          <!-- marcas de cota, estilo desenho técnico -->
          <g stroke="rgba(251,250,247,0.3)" stroke-width="1">
            <line x1="20" y1="488" x2="20" y2="496"/><line x1="580" y1="488" x2="580" y2="496"/>
            <line x1="20" y1="492" x2="580" y2="492"/>
          </g>
        </svg>